server.port=8080
spring.application.name=Self-Alert
spring.datasource.url=jdbc:sqlite:safe-alert.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
safealert.cors.origens=http://localhost:5173,http://127.0.0.1:5173
safealert.simulacao.habilitada=true
safealert.limites.temperatura-atencao=40
safealert.limites.temperatura-alerta=57
safealert.limites.temperatura-critica=80
safealert.limites.fumaca-atencao=30
safealert.limites.fumaca-alerta=50
safealert.limites.fumaca-critica=85
